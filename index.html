<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Братская Система v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Общие карточки окон */
        .window-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: none; /* Переключается через JS */
        }

        .window-card.active {
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .profile-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .profile-option {
            background: #1e293b;
            border: 2px solid #334155;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .profile-option:hover {
            border-color: #475569;
            background: #24344d;
        }

        .profile-option.active {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.15);
        }

        .profile-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .profile-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-submit {
            width: 100%;
            background: #6366f1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .btn-submit:hover {
            background: #4f46e5;
        }

        .switch-link {
            color: #818cf8;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px;
            border-radius: 6px;
        }

        /* Стили Личного Кабинета */
        .cabinet-card {
            max-width: 700px;
            text-align: left;
        }

        .cab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-stavka { background: #ea580c; color: #fff; }
        .badge-bb { background: #dc2626; color: #fff; }

        .btn-logout {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-logout:hover { background: #475569; }

        .role-content {
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Окно 1: РЕГИСТРАЦИЯ -->
    <div class="window-card active" id="registerWindow">
        <h1>Регистрация</h1>
        <p class="subtitle">Создайте новый аккаунт</p>
        <div class="error-msg" id="regError"></div>

        <div class="input-group">
            <label>Никнейм</label>
            <input type="text" id="regNickname" placeholder="Введите никнейм" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="regPassword" placeholder="Придумайте пароль">
        </div>

        <label style="text-align: left; display: block; margin-bottom: 8px;">Выберите ваш профиль</label>
        <div class="profile-selection">
            <div class="profile-option" onclick="selectRegProfile('Ставочник', this)">
                <div class="profile-icon">🧡</div>
                <div class="profile-title">Ставочник</div>
            </div>
            <div class="profile-option" onclick="selectRegProfile('Работник BB', this)">
                <div class="profile-icon">❤️</div>
                <div class="profile-title">Работник BB</div>
            </div>
        </div>

        <button class="btn-submit" onclick="handleRegister()">Зарегистрироваться</button>
        <p style="font-size: 0.9rem; color: #94a3b8;">
            Уже есть аккаунт? <span class="switch-link" onclick="switchWindow('loginWindow')">Войти</span>
        </p>
    </div>

    <!-- Окно 2: АВТОРИЗАЦИЯ (ВХОД) -->
    <div class="window-card" id="loginWindow">
        <h1>Вход в систему</h1>
        <p class="subtitle">Введите свои данные для входа</p>
        <div class="error-msg" id="loginError"></div>

        <div class="input-group">
            <label>Никнейм</label>
            <input type="text" id="loginNickname" placeholder="Ваш никнейм" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="loginPassword" placeholder="Ваш пароль">
        </div>

        <button class="btn-submit" onclick="handleLogin()">Войти в аккаунт</button>
        <p style="font-size: 0.9rem; color: #94a3b8;">
            Нет аккаунта? <span class="switch-link" onclick="switchWindow('registerWindow')">Создать аккаунт</span>
        </p>
    </div>

    <!-- Окно 3: ЛИЧНЫЙ КАБИНЕТ -->
    <div class="window-card cabinet-card" id="cabinetWindow">
        <div class="cab-header">
            <div>
                <h2 id="userHello" style="color: #fff; font-size: 1.5rem;">Привет, Ник!</h2>
                <div style="margin-top: 5px;">
                    <span id="userBadge" class="badge">Роль</span>
                </div>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Выйти</button>
        </div>

        <!-- Контент подстраивается под роль через JS -->
        <div id="cabinetBody"></div>
    </div>

    <script>
        let selectedRegProfile = "";

        // Инициализация: если юзер уже залогинен, сразу кидаем в кабинет
        window.onload = function() {
            const currentSession = JSON.parse(localStorage.getItem('activeSession'));
            if (currentSession) {
                openCabinet(currentSession.nickname, currentSession.profile);
            }
        };

        // Переключение окон
        function switchWindow(windowId) {
            document.querySelectorAll('.window-card').forEach(w => w.classList.remove('active'));
            document.getElementById(windowId).classList.add('active');
            clearErrors();
        }

        function clearErrors() {
            document.getElementById('regError').style.display = 'none';
            document.getElementById('loginError').style.display = 'none';
        }

        // Выбор профиля при регистрации
        function selectRegProfile(profileName, element) {
            document.querySelectorAll('#registerWindow .profile-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            selectedRegProfile = profileName;
            document.getElementById('regError').style.display = 'none';
        }

        // РЕГИСТРАЦИЯ
        function handleRegister() {
            const nickname = document.getElementById('regNickname').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const errBox = document.getElementById('regError');

            if (!nickname || !password || !selectedRegProfile) {
                errBox.innerText = "Заполните все поля и выберите профиль!";
                errBox.style.display = "block";
                return;
            }

            // Получаем базу пользователей из localStorage
            let users = JSON.parse(localStorage.getItem('usersDatabase')) || [];

            // Проверка дубликатов никнейма
