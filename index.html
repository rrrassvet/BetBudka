<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy League BB</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0f111a 0%, #1a0f11 100%); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .window-card { background: rgba(20, 24, 38, 0.95); border: 2px solid #3b82f6; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; display: none; }
        .window-card.active { display: block; }
        h1 { font-size: 1.6rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 0.85rem; font-weight: 500; }
        input { width: 100%; padding: 12px; background: #0b0d14; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #ef4444; }
        .profile-selection { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .profile-option { background: #161b26; border: 2px solid #475569; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; }
        .profile-option.active { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .btn-submit { width: 100%; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 15px; }
        .btn-submit:hover { background: #dc2626; }
        .switch-link { color: #3b82f6; cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-bottom: 15px; display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239,68,68,0.2); padding: 10px; border-radius: 6px; }
        .cabinet-card { max-width: 950px; width: 100%; text-align: left; }
        .cab-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3b82f6; padding-bottom: 15px; margin-bottom: 20px; }
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .badge-stavka { background: #3b82f6; color: #fff; }
        .badge-bb { background: #ef4444; color: #fff; }
        .btn-logout { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .role-content { background: #111420; padding: 20px; border-radius: 8px; border: 1px solid #3b82f6; margin-top: 15px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); gap: 30px; margin-top: 15px; }
        .card-item { background: #161b26; border: 2px solid #475569; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 640px; }
        .card-item img { width: 600px; height: 800px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .user-row { background: #161b26; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-small { background: #3b82f6; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .tab-menu { display: flex; background: #0b0f19; padding: 4px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #475569; }
        .tab-btn { flex: 1; background: transparent; color: #94a3b8; border: none; padding: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; border-radius: 4px; text-align: center; }
        .tab-btn.active { background: #2563eb; color: #ffffff; }
        .tab-btn.active-red { background: #dc2626; color: #ffffff; }
        .bracket-wrapper { display: flex; align-items: flex-start; justify-content: space-between; gap: 60px; margin-top: 25px; padding: 30px 20px; background: #0b0f19; border-radius: 12px; border: 1px solid #1e293b; overflow-x: auto; width: 100%; }
        .bracket-column { display: flex; flex-direction: column; gap: 40px; height: auto; position: relative; min-width: 360px; }
        .bracket-column:nth-child(1) { gap: 30px; }
        .bracket-column:nth-child(2) { gap: 180px; padding-top: 85px; }
        .bracket-column:nth-child(3) { gap: 0; padding-top: 235px; }
        .bracket-column-title { text-align: center; font-size: 0.9rem; text-transform: uppercase; color: #ffffff; background: #161b26; padding: 8px 18px; border-radius: 20px; margin-bottom: 10px; font-weight: bold; border: 2px solid #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .match-block { background: #161b26; border: 2px solid #475569; border-radius: 12px; width: 360px; padding: 16px; position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.6), 0 0 15px rgba(239, 68, 68, 0.1); }
        .match-block-pair-num { position: absolute; top: -12px; left: 15px; background: #2563eb; color: #ffffff; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; z-index: 10; }
        .team-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .team-row:last-child { border-bottom: none; }
        .team-info { display: flex; align-items: center; gap: 16px; flex: 1; }
        .team-avatar-square { width: 110px; height: 110px; border-radius: 8px; object-fit: cover; background: #070a14; border: 2px solid #475569; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: border-color 0.2s; }
        .team-avatar-square:hover { border-color: #ef4444; }
        .team-name-select { background: transparent; border: none; color: #ffffff; font-size: 1.1rem; font-weight: bold; outline: none; cursor: pointer; width: 160px; }
        .team-name-select option { background: #161b26; color: #fff; }
        .vs-divider { position: absolute; right: 105px; top: 50%; transform: translateY(-50%); font-size: 1rem; color: #ef4444; font-weight: 900; letter-spacing: 1px; }
        .file-upload-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 75px; height: 75px; background: #0b0d14; border: 2px dashed #475569; border-radius: 6px; position: relative; }
        .file-upload-zone img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        .cabinet-card { max-width: 100% !important; width: 95vw !important; }
    </style>
</head>
<body>
    <!-- ОКНО 1: РЕГИСТРАЦИЯ -->
    <div class="window-card active" id="registerWindow">
        <h1>Регистрация</h1>
        <p class="subtitle">Создайте аккаунт в лиге</p>
        <div class="error-msg" id="regError"></div>
        <div class="input-group">
            <label>Никнейм</label>
            <input type="text" id="regNickname" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="regPassword">
        </div>
        <label style="text-align: left; display: block; margin-bottom: 8px; font-size: 0.85rem;">Выберите профиль</label>
        <div class="profile-selection">
            <div class="profile-option" onclick="selectRegProfile('Ставочник', this)">Ставочник</div>
            <div class="profile-option" onclick="selectRegProfile('Работник BB', this)">Работник BB</div>
        </div>
        <button class="btn-submit" onclick="handleRegister()">Зарегистрироваться</button>
        <p style="font-size: 0.9rem; color: #94a3b8;">Уже есть аккаунт? <span class="switch-link" onclick="switchWindow('loginWindow')">Войти</span></p>
    </div>

    <!-- ОКНО 2: ВХОД -->
    <div class="window-card" id="loginWindow">
        <h1>Вход в систему</h1>
        <p class="subtitle">Введите свои данные</p>
        <div class="error-msg" id="loginError"></div>
        <div class="input-group">
            <label>Никнейм</label>
            <input type="text" id="loginNickname" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="loginPassword">
        </div>
        <button class="btn-submit" onclick="handleLogin()">Войти в аккаунт</button>
        <p style="font-size: 0.9rem; color: #94a3b8;">Нет аккаунта? <span class="switch-link" onclick="switchWindow('registerWindow')">Создать аккаунт</span></p>
    </div>

    <!-- ОКНО 3: ЛИЧНЫЙ КАБИНЕТ -->
    <div class="window-card cabinet-card" id="cabinetWindow">
        <div class="cab-header">
            <div>
                <h2 id="userHello" style="color: #fff; font-size: 1.4rem;">Привет</h2>
                <div style="margin-top: 5px;"><span id="userBadge" class="badge">Роль</span></div>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Выйти</button>
        </div>
        <div id="cabinetBody"></div>
    </div>
    <script>
        const SUPABASE_URL = "sb_publishable_Cf2Xumahh3LUmxP0732GNQ_fP3eyxVK";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZGxhdWp3d2dlY21hd2tiYW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDk3MzMsImV4cCI6MjEwNDAyNTczM30.qhglbIu-M4OJLdirqJvhzeBQhh5Eat3IpO52-9eH8ec";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedRegProfile = "";
        let activeMainTab = "cards"; 
        let activeFantasySubTab = "players"; 

        const playoffTeams = [
            "Команда 1", "Команда 2", "Команда 3", "Команда 4",
            "Команда 5", "Команда 6", "Команда 7", "Команда 8"
        ];

        let usersDatabase=[];let teamImagesDatabase={};async function loadCloudData(){try{let{data:u}=await supabase.from('app_data').select('*').eq('key','usersDatabase').single();if(u)usersDatabase=u.value;else await supabase.from('app_data').insert([{key:'usersDatabase',value:[]}]);let{data:t}=await supabase.from('app_data').select('*').eq('key','teamImagesDatabase').single();if(t)teamImagesDatabase=t.value;else await supabase.from('app_data').insert([{key:'teamImagesDatabase',value:{}}]);const s=JSON.parse(localStorage.getItem('activeSession'));if(s)openCabinet(s.nickname,s.profile)}catch(e){console.log(e)}}function subscribeToCloudChanges(){supabase.channel('schema-db-changes').on('postgres_changes',{event:'*',scheme:'public',table:'app_data'},p=>{if(p.new&&p.new.key==='usersDatabase')usersDatabase=p.new.value;if(p.new&&p.new.key==='teamImagesDatabase')teamImagesDatabase=p.new.value;const s=JSON.parse(localStorage.getItem('activeSession'));if(s)openCabinet(s.nickname,s.profile)}).subscribe()}window.onload=async function(){await loadCloudData();subscribeToCloudChanges()};async function saveCloudData(k,v){await supabase.from('app_data').update({value:v}).eq('key',k)}

        };
       
        function switchWindow(id) {
            document.querySelectorAll('.window-card').forEach(w => w.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('regError').style.display = 'none';
            document.getElementById('loginError').style.display = 'none';
        }

        function selectRegProfile(profile, el) {
            document.querySelectorAll('#registerWindow .profile-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
            selectedRegProfile = profile;
        }

        function switchMainTab(tabName, nick, profile) {
            activeMainTab = tabName;
            openCabinet(nick, profile);
        }

        function switchFantasySubTab(subTabName, nick, profile) {
            activeFantasySubTab = subTabName;
            openCabinet(nick, profile);
        }

        function handleRegister(){const n=document.getElementById('regNickname').value.trim();const p=document.getElementById('regPassword').value.trim();const e=document.getElementById('regError');if(!n||!p||!selectedRegProfile){e.innerText="Заполните все поля и выберите профиль!";e.style.display="block";return}if(usersDatabase.some(u=>u.nickname.toLowerCase()===n.toLowerCase())){e.innerText="Этот никнейм уже занят!";e.style.display="block";return}if(selectedRegProfile==='Работник BB'){const a=['rrrassvet','TimeMine559'];if(!a.includes(n)){e.innerText="Доступ к профилю Работник BB запрещен!";e.style.display="block";return}}usersDatabase.push({nickname:n,password:p,profile:selectedRegProfile,cards:[],predicts:{},selectedPlayers:[]});saveCloudData('usersDatabase',usersDatabase);localStorage.setItem('activeSession',JSON.stringify({nickname:n,profile:selectedRegProfile}));openCabinet(n,selectedRegProfile)}function handleLogin(){const n=document.getElementById('loginNickname').value.trim();const p=document.getElementById('loginPassword').value.trim();const e=document.getElementById('loginError');if(!n||!p){e.innerText="Введите никнейм и пароль!";e.style.display="block";return}const u=usersDatabase.find(x=>x.nickname.toLowerCase()===n.toLowerCase());if(!u||u.password!==p){e.innerText="Неверный никнейм или пароль!";e.style.display="block";return}localStorage.setItem('activeSession',JSON.stringify({nickname:u.nickname,profile:u.profile}));openCabinet(u.nickname,u.profile)}

        }

        function handleLogout() {
            localStorage.removeItem('activeSession');
            switchWindow('loginWindow');
            document.getElementById('regNickname').value = "";
            document.getElementById('regPassword').value = "";
            document.getElementById('loginNickname').value = "";
            document.getElementById('loginPassword').value = "";
            selectedRegProfile = "";
            document.querySelectorAll('#registerWindow .profile-option').forEach(o => o.classList.remove('active'));
        }

        function openCabinet(nick,profile){switchWindow('cabinetWindow');document.getElementById('userHello').innerText="Привет, "+nick+"!";const badge=document.getElementById('userBadge');badge.innerText=profile;const body=document.getElementById('cabinetBody');let tabMenuHtml="<div class='tab-menu'><button class='tab-btn "+(activeMainTab==="cards"?"active":"")+"' onclick='switchMainTab(\"cards\",\""+nick+"\",\""+profile+"\")'>Карточки</button><button class='tab-btn "+(activeMainTab==="fantasy"?"active":"")+"' onclick='switchMainTab(\"fantasy\",\""+nick+"\",\""+profile+"\")'>Фэнтези-Лига</button></div>";if(profile==='Ставочник'){badge.className="badge badge-stavka";const user=usersDatabase.find(u=>u.nickname===nick)||\{cards:[],predicts:\},selectedPlayers:[]\};if(activeMainTab==="cards")\{let html="";if(!user.cards||user.cards.length===0)\{html="<p style='color:#94a3b8;'>У вас пока нет добавленных карточек.</p>";\}else\{html="<div class='cards-grid'>";user.cards.forEach(url=>{html+="<div class='card-item'><img src='"+url+"' alt='Card'><div style='font-size:0.8rem;margin-top:5px;color:#94a3b8;'>Добавлено админом</div></div>";});html+="</div>";\}body.innerHTML=tabMenuHtml+"<div class='role-content'><h3>Мои карточки</h3>"+html+"</div>";\}else if(activeMainTab==="fantasy")\{renderFantasyLeagueBlock(body,tabMenuHtml,user,nick,profile,false);\}\}else if(profile==='Работник BB'){badge.className="badge badge-bb";let stavshiki=usersDatabase.filter(u=>u.profile==='Ставочник');let listHtml="";if(stavshiki.length===0)\{listHtml="<p style='color:#94a3b8;margin-top:10px;'>Ставочников пока нет в базе.</p>";\}else\{stavshiki.forEach(u=>{listHtml+="<div class='user-row'><div><strong>"+u.nickname+"</strong><br><span style='font-size:0.8rem;color:#94a3b8;'>Карточек: "+(u.cards?u.cards.length:0)+"</span></div><div><button class='btn-small' style='margin-right:8px; background:#dc2626;' onclick='viewUserFantasy(\""+u.nickname+"\")'>Фэнтези</button><button class='btn-small' onclick='manageUserCards(\""+u.nickname+"\")'>Карточки</button></div></div>";});\}let teamsUploadHtml="<h4 style='color:#ffffff; margin-top:25px; margin-bottom:15px; border-top:1px solid #475569; padding-top:15px; text-transform:uppercase; font-size:1rem;'>Загрузка аватарок команд (500x500 PNG)</h4><div style='display:grid; grid-template-columns: 1fr 1fr; gap:15px;'>";playoffTeams.forEach((teamName,index)=>{let currentImg=teamImagesDatabase["team_"+index]||"";let imgPreview=currentImg?"<img src='"+currentImg+"' style='width:40px; height:40px; object-fit:cover; border-radius:4px; border:1px solid #475569;'>":"<div style='width:40px; height:40px; background:#070a14; border-radius:4px;'></div>";teamsUploadHtml+="<div style='background:#161b26; padding:10px; border-radius:6px; border:1px solid #475569; display:flex; align-items:center; justify-content:space-between; gap:10px;'><div style='flex:1;'><div style='font-size:0.85rem; font-weight:bold; color:#fff; margin-bottom:5px;'>"+teamName+"</div><input type='file' accept='.png' onchange='uploadTeamAvatar("+index+", this)' style='font-size:0.75rem; width:100%; color:#94a3b8;'></div>"+imgPreview+"</div>";});teamsUploadHtml+="</div>";body.innerHTML="<div class='role-content'><h3>Панель Работника BB</h3><p style='color:#94a3b8;font-size:0.9rem;'>Управление профилями Ставочников:</p><div style='margin-top:15px;'> "+listHtml+"</div>"+teamsUploadHtml+"</div>";}}
        
        }
        
       function renderFantasyLeagueBlock(c,m,u,n,p,i){let a=i?"active-red":"active";let s="<div class='tab-menu' style='margin-top:10px; border-color:#2563eb;'><button class='tab-btn "+(activeFantasySubTab==="players"?a:"")+"' onclick='switchFantasySubTab(\"players\",\""+n+"\",\""+p+"\")'>Игроки</button><button class='tab-btn "+(activeFantasySubTab==="playoff"?a:"")+"' onclick='switchFantasySubTab(\"playoff\",\""+n+"\",\""+p+"\")'>Плей-Офф</button></div>";let html="";if(activeFantasySubTab==="players"){let uc=u.cards||[];let sp=u.selectedPlayers||[];let ph="";if(uc.length===0){ph="<p style='color:#94a3b8;'>У вас пока нет доступных карточек. Попросите Работника BB добавить их вам.</p>";}else{let ash="";if(sp.length===0){ash="<p style='color:#ef4444; font-size:0.9rem; margin-bottom:15px;'>Вы еще не выбрали свой состав! Выберите строго 3 карточки ниже.</p>";}else{ash="<h4 style='color:#fff; margin-bottom:10px;'>Ваш текущий состав лиги:</h4><div class='cards-grid' style='margin-bottom:25px;'>";sp.forEach((url,x)=>{ash+="<div class='card-item'><img src='"+url+"'><div style='font-size:0.8rem;margin-top:5px;color:#2563eb;'>Игрок "+(x+1)+"</div></div>";});ash+="</div>";}let pool="<h4 style='color:#94a3b8; margin-bottom:10px; border-top:1px solid #475569; padding-top:15px;'>Доступный пул ваших карточек:</h4><div class='cards-grid'>";uc.forEach((url,idx)=>{let sel=sp.includes(url);let txt=sel?"Выбрано":"Выбрать в состав";let stl=sel?"background:#22c55e;":"background:#2563eb;";let dis=i?"display:none;":"";pool+="<div class='card-item'><img src='"+url+"'><button class='btn-small' style='width:100%; margin-top:5px; font-size:0.75rem; "+stl+" "+dis+"' onclick='togglePlayerInFantasy(\""+n+"\",\""+url+"\")'>"+txt+"</button></div>";});pool+="</div>";ph=ash+pool;}html="<div class='role-content'><h3>Фэнтези-Лига: Выбор Игроков</h3><p style='color:#94a3b8;font-size:0.9rem;margin-top:5px;margin-bottom:15px;'>Соберите свою команду (строго 3 карточки):</p>"+ph+"</div>";}else if(activeFantasySubTab==="playoff"){let pr=u.predicts||{};let uc=u.cards||[];function bOpts(stg){let cv=pr[stg+"_card"]|| "";let o="<option value=''>Карта...</option>";uc.forEach((url,x)=>{let usd=false;const stgs=["q1","q2","q3","q4","h1","h2","f1"];stgs.forEach(s=>{if(s!==stg&&pr[s+"_card"]===url)usd=true;});if(!usd||url===cv){o+="<option value='"+url+"' "+(url===cv?"selected":"")+">Карточка "+(x+1)+"</option>";}});return o;}function bMatch(stg,num,dA,dB,iA,iB){let wV=pr[stg+"_win"]||"";let lV=pr[stg+"_lose"]||"";let cV=pr[stg+"_card"]||"";let dis=i?"disabled":"";let oA="<option value=''>"+dA+"</option>";let oB="<option value=''>"+dB+"</option>";if(stg.startsWith("q")){oA="<option value='"+dA+"' selected>"+dA+"</option>";oB="<option value='"+dB+"' selected>"+dB+"</option>";}else{playoffTeams.forEach(t=>{oA+="<option value='"+t+"' "+(wV===t?"selected":"")+">"+t+"</option>";oB+="<option value='"+t+"' "+(lV===t?"selected":"")+">"+t+"</option>";});}let sA=teamImagesDatabase["team_"+iA]||"";let sB=teamImagesDatabase["team_"+iB]||"";let imA=sA?"<img src='"+sA+"' class='team-avatar-square'>":"<div class='team-avatar-square'></div>";let imB=sB?"<img src='"+sB+"' class='team-avatar-square'>":"<div class='team-avatar-square'></div>";let selH=i?"":"<div class='file-upload-zone' style='margin-left:10px; width:70px; height:50px;'><select "+dis+" onchange='savePlayoffCard(\""+n+"\",\""+stg+"\",this.value)' style='width:100%; font-size:0.7rem; background:#161b26; color:#fff; border:1px solid #475569; border-radius:4px;'>"+bOpts(stg)+"</select></div>";return "<div class='match-block'><div class='match-block-pair-num'>#"+num+"</div><div style='display:flex; align-items:center; justify-content:space-between;'><div style='flex:1;'><div class='team-row'><div class='team-info'>"+imA+"<select "+dis+" class='team-name-select' onchange='savePlayoffSelect(\""+n+"\",\""+stg+"_win\",this.value)'>"+oA+"</select></div></div><div class='team-row'><div class='team-info'>"+imB+"<select "+dis+" class='team-name-select' onchange='savePlayoffSelect(\""+n+"\",\""+stg+"_lose\",this.value)'>"+oB+"</select></div></div></div><div class='vs-divider'>VS</div>"+selH+(cV?"<div class='file-upload-zone' style='width:45px; height:45px; margin-left:5px;'><img src='"+cV+"'></div>":"")+"</div></div>";}let brH="<div class='bracket-wrapper'><div class='bracket-column'><div class='bracket-column-title'>1/4 Финал</div>"+bMatch("q1","1","Команда 1","Команда 2",0,1)+bMatch("q2","2","Команда 3","Команда 4",2,3)+bMatch("q3","3","Команда 5","Команда 6",4,5)+bMatch("q4","4","Команда 7","Команда 8",6,7)+"</div><div class='bracket-column'><div class='bracket-column-title'>1/2 Финал</div>"+bMatch("h1","1","Ожидание...","Ожидание...",0,1)+bMatch("h2","2","Ожидание...","Ожидание...",2,3)+"</div><div class='bracket-column'><div class='bracket-column-title'>Финал WB</div>"+bMatch("f1","1","Финалист 1","Финалист 2",4,5)+"</div></div>";html="<div class='role-content'><h3>Фэнтези-Лига: Плей-Офф</h3><p style='color:#94a3b8;font-size:0.9rem;'>Выберите исходы и прикрепите карты команд:</p>"+brH+"</div>";}if(i){c.innerHTML=m+s+html+"<button class='btn-logout' style='width:100%;margin-top:20px;' onclick='returnToBBPanel()'>Назад к списку</button>";}else{c.innerHTML=m+s+html;}}function togglePlayerInFantasy(n,url){const idx=usersDatabase.findIndex(u=>u.nickname===n);if(idx!==-1){if(!usersDatabase[idx].selectedPlayers)usersDatabase[idx].selectedPlayers=[];let s=usersDatabase[idx].selectedPlayers;const cIdx=s.indexOf(url);if(cIdx!==-1){s.splice(cIdx,1);}else{if(s.length>=3){alert('Вы уже выбрали максимум (3 карточки)! Сначала уберите кого-то из состава.');return;}s.push(url);}usersDatabase[idx].selectedPlayers=s;saveCloudData('usersDatabase',usersDatabase);openCabinet(n,'Ставочник');}}function savePlayoffSelect(n,k,v){const idx=usersDatabase.findIndex(u=>u.nickname===n);if(idx!==-1){if(!usersDatabase[idx].predicts)usersDatabase[idx].predicts={};usersDatabase[idx].predicts[k]=v;saveCloudData('usersDatabase',usersDatabase);}}function savePlayoffCard(n,stg,bd){const idx=usersDatabase.findIndex(u=>u.nickname===n);if(idx!==-1){if(!usersDatabase[idx].predicts)usersDatabase[idx].predicts={};const cp=usersDatabase[idx].predicts;if(bd!==""){const stgs=["q1","q2","q3","q4","h1","h2","f1"];let dup=false;stgs.forEach(s=>{if(s!==stg&&cp[s+"_card"]===bd)dup=true;});if(dup){alert('Эту особую карточку конкретной команды можно добавить лишь один раз!');openCabinet(n,'Ставочник');return;}}cp[stg+"_card"]=bd;usersDatabase[idx].predicts=cp;saveCloudData('usersDatabase',usersDatabase);openCabinet(n,'Ставочник');}}function uploadTeamAvatar(idx,input){if(!input.files||input.files.length===0)return;const r=new FileReader();r.onload=function(e){teamImagesDatabase["team_"+idx]=e.target.result;saveCloudData('teamImagesDatabase',teamImagesDatabase);alert('Аватарка успешно обновлена!');};r.readAsDataURL(input.files[0]);}function viewUserFantasy(tN){const u=usersDatabase.find(x=>x.nickname===tN)||\{cards:[],predicts:\{\},selectedPlayers:[]\};const b=document.getElementById('cabinetBody');let t="<div style='background:rgba(37,99,235,0.1); border:1px dashed #2563eb; padding:10px; border-radius:4px; margin-bottom:15px; font-size:0.9rem; color:#3b82f6; font-weight:500;'>Вы просматриваете Фэнтези-Лигу пользователя: <strong>"+tN+"</strong></div>";renderFantasyLeagueBlock(b,t,u,tN,'Работник BB',true);}function manageUserCards(tN){const b=document.getElementById('cabinetBody');const u=usersDatabase.find(x=>x.nickname===tN);let h="";if(u.cards&&u.cards.length > 0){h="<div class='cards-grid'>";u.cards.forEach(url=>{h+="<div class='card-item'><img src='"+url+"'></div>";});h+="</div>";}b.innerHTML="<div class='role-content'><h3>Управление карточками: "+tN+"</h3><div style='margin:15px 0;'><label>Выберите карточку (PNG):</label><input type='file' id='newCardFile' accept='.png' style='margin-bottom:10px; background:#070a14; border:1px solid #475569; padding:10px; width:100%; color:#fff; border-radius:4px;'><button class='btn-submit' style='margin-top:10px; margin-bottom:0;' onclick='addCardToUser(\""+tN+"\")'>Загрузить PNG карточку</button></div><h4>Текущие карточки пользователя:</h4>"+h+"<button class='btn-logout' style='width:100%;margin-top:20px;' onclick='returnToBBPanel()'>Назад к списку</button></div>";}function addCardToUser(tN){const fi=document.getElementById('newCardFile');if(!fi||fi.files.length===0){alert('Выберите PNG файл!');return;}const r=new FileReader();r.onload=function(e){const idx=usersDatabase.findIndex(u=>u.nickname===tN);if(idx!==-1){if(!usersDatabase[idx].cards)usersDatabase[idx].cards=[];usersDatabase[idx].cards.push(e.target.result);saveCloudData('usersDatabase',usersDatabase);alert('PNG карточка успешно загружена!');manageUserCards(tN);}};r.readAsDataURL(fi.files[0]);}function returnToBBPanel(){const s=JSON.parse(localStorage.getItem('activeSession'));openCabinet(s.nickname,s.profile);}
    </script>
